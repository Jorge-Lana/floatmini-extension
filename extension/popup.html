<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloatMini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="icon-badge" src="icons/icon48.png" alt="">
    <div class="brand">
      <h1 class="brand-title">FloatMini</h1>
      <p class="brand-sub">Janela flutuante sempre no topo</p>
    </div>
    <span class="version" id="version"></span>
  </header>

  <main class="content">
    <button id="btn-float" class="btn-primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg><span>Flutuar mídia desta aba</span></button>
    <p class="hint">
      Atalho na página do vídeo: <kbd>Alt</kbd> <kbd>P</kbd>, ou o ícone de janela flutuante na barra do player.
    </p>
    <p id="status" class="status" role="status" hidden></p>

    <div class="section-title">Controles rápidos</div>
    <div class="quick-controls-grid">
      <button class="icon-btn" type="button" data-action="SEEK" data-seconds="-10" title="Voltar 10 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg><span>10s</span></button>
      <button class="icon-btn" type="button" data-action="SEEK" data-seconds="10" title="Avançar 10 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg><span>10s</span></button>
      <button class="icon-btn" type="button" data-action="SHUFFLE" title="Ordem aleatória (YT Music, Spotify, playlists do YouTube)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg><span>Aleatório</span></button>
      <button class="icon-btn" type="button" data-action="REPEAT" title="Alterna os modos de repetição do site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span>Repetir</span></button>
    </div>

    <div class="section-title">Tamanho da janela de vídeo</div>
    <div class="size-selector" role="group" aria-label="Tamanho da janela de vídeo">
      <button class="size-btn" type="button" data-size="auto" title="480×270">Auto</button>
      <button class="size-btn" type="button" data-size="340x190">Mini</button>
      <button class="size-btn" type="button" data-size="480x270">Médio</button>
      <button class="size-btn" type="button" data-size="640x360">Grande</button>
    </div>

    <form id="url-form" class="quick-url-box">
      <label for="url-input">Abrir um link numa janela compacta</label>
      <div class="input-row">
        <span class="input-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></span>
        <input type="url" id="url-input" placeholder="Cole um link de vídeo" required>
        <button type="submit">Abrir</button>
      </div>
    </form>
  </main>

  <footer class="footer">
    <a class="footer-link" href="https://github.com/Jorge-Lana/floatmini-extension" target="_blank" rel="noopener noreferrer">Código aberto</a>
    <a class="support-link" href="https://buymeacoffee.com/jorgelana" target="_blank" rel="noopener noreferrer" title="Apoie o FloatMini no Buy Me a Coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>Apoie o projeto</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
