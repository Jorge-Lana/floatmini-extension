name: Release

# Publica sozinho quando a versão de extension/manifest.json muda na main.
# Fluxo: npm run version:set -- 1.3.4 → commit → push na main. Pronto.
#
# Se já existe uma Release com essa versão, não faz nada (pushes comuns
# sem mudar a versão não publicam). Também dá para rodar à mão em
# Actions → Release → Run workflow.
#
# Cada loja só é publicada se os segredos dela existirem
# (Settings → Secrets and variables → Actions). Ver docs/RELEASE.md.
on:
  push:
    branches: [main]
    paths:
      - 'extension/manifest.json'
  workflow_dispatch:

permissions:
  contents: write # criar a tag e a Release no GitHub

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão nova?
        id: version
        run: |
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          if [ "$MANIFEST" != "$PKG" ]; then
            echo "::error::manifest.json ($MANIFEST) e package.json ($PKG) estão com versões diferentes. Use npm run version:set."
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
          if gh release view "v$MANIFEST" >/dev/null 2>&1; then
            echo "A versão $MANIFEST já foi lançada. Nada a fazer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'

      - name: Instalar, testar e gerar pacotes
        if: steps.version.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile
          npm run lint
          npm test
          npm run zip:ext

      - name: Publicar no Firefox (addons.mozilla.org)
        if: steps.version.outputs.publish == 'true' && env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/firefox
          unzip -q "dist-extension/floatmini-firefox-$VERSION.zip" -d /tmp/firefox
          # approval-timeout=0: envia para análise e não fica esperando a aprovação.
          npx --yes web-ext@10 sign \
            --source-dir /tmp/firefox \
            --channel listed \
            --approval-timeout 0 \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET"

      - name: Publicar na Chrome Web Store
        if: steps.version.outputs.publish == 'true' && env.CWS_EXTENSION_ID != '' && env.CWS_REFRESH_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: npx --yes chrome-webstore-upload-cli@4 --source "dist-extension/floatmini-extension-$VERSION.zip"

      # Por último: a Release (e a tag) só existe se os envios deram certo,
      # então um push que falhou pode ser repetido.
      - name: Criar tag e Release no GitHub
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist-extension/floatmini-extension-$VERSION.zip" \
            "dist-extension/floatmini-firefox-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "FloatMini $VERSION" \
            --generate-notes

      - name: Resumo
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          {
            echo "## FloatMini $VERSION"
            if [ "$PUBLISH" != "true" ]; then echo "- Versão já lançada antes: nada publicado."; exit 0; fi
            if [ -n "$AMO_API_KEY" ]; then echo "- Firefox: enviado para análise"; else echo "- Firefox: **pulado** (sem segredos AMO_*)"; fi
            if [ -n "$CWS_REFRESH_TOKEN" ]; then echo "- Chrome Web Store: enviado para análise"; else echo "- Chrome Web Store: **pulado** (sem segredos CWS_*)"; fi
            echo "- Release no GitHub: v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
